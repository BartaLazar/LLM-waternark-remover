[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synreplace"
version = "0.1.0"
description = "Replace every N-th word of a text with its closest WordNet synonym."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["nltk>=3.8"]

[project.scripts]
synreplace = "synreplace.cli:main"

[tool.setuptools]
packages = ["synreplace"]
